# Deploy to GitHub Pages from an allowlist: only what the game loads.
# (tests/, scripts/, docs/, output/, art-src/ and the *.md notes stay in the repo but are not deployed.
#  Before 12 Nov 2569 Pages served the whole branch: 1,145 MB, over the 1 GB limit.)
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage game files (allowlist)
        run: |
          mkdir _site
          cp index.html .nojekyll _site/
          cp -r src img audio _site/
          du -sm _site
          echo "files: $(find _site -type f | wc -l)"
          SIZE=$(du -sb _site | cut -f1)
          echo "staged bytes: $SIZE"
          # fail early if we drift back toward the 1 GB Pages limit
          if [ "$SIZE" -gt 1000000000 ]; then echo "::error::artifact over 1 GB"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
