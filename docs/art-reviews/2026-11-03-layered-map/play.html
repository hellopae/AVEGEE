<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AVEGEE · กล้องติดตามและเลเยอร์</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101019;color:#eee0c6;font:15px system-ui}main{max-width:1280px;margin:auto}header{padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:18px;margin:0 auto 0 0}select,button{font:inherit;border:1px solid #655538;border-radius:7px;color:#eadcbf;background:#25202a;padding:8px 12px}button[aria-pressed=true]{background:#d6b16e;color:#211b24}button:disabled{opacity:.5}#scene{display:block;width:100%;aspect-ratio:16/9;background:#171b29;outline:none;touch-action:manipulation}.frame{position:relative}#state{position:absolute;left:16px;bottom:14px;background:#11121dcc;padding:7px 12px;border-radius:7px;pointer-events:none;max-width:90%;font-size:13px}footer{padding:12px 18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}label{display:flex;align-items:center;gap:6px}p,details{padding:0 18px;color:#a99f95;line-height:1.6}details{font-size:13px;padding-bottom:20px}a{color:#d6b16e}#retry[hidden]{display:none}@media(max-width:600px){header{padding:9px;gap:6px}h1{width:100%;font-size:16px}select,button{padding:7px 9px;font-size:13px}footer{gap:12px;padding:10px}#state{font-size:11px;left:8px;bottom:8px}}</style>
<main><header><h1>AVEGEE · กล้องตาม Yama</h1><select id="map" aria-label="แผนที่"><option value="border12">ชายแดน 1–2</option><option value="zone1">โซน 1</option><option value="zone2">โซน 2</option><option value="zone3">โซน 3</option><option value="zone4">โซน 4</option><option value="border23">ชายแดน 2–3</option><option value="border34">ชายแดน 3–4</option></select><button id="near" aria-pressed="true">ใกล้</button><button id="closer" aria-pressed="false">ใกล้มาก</button><button id="pause">หยุด</button><button id="retry" hidden>ลองโหลดอีกครั้ง</button></header>
<div class="frame"><canvas id="scene" width="1200" height="675" tabindex="0" aria-label="คลิกพื้นเพื่อพา Yama เดิน"></canvas><output id="state">กำลังโหลดฉากรอบตัว…</output></div>
<footer><label><input id="dof" type="checkbox" checked>Depth of field</label><label><input id="parallax" type="checkbox" checked>Parallax ฉากไกล</label><label><input id="motion" type="checkbox" checked>น้ำ/ลาวา</label><label><input id="weather" type="checkbox" checked>สภาพอากาศ</label></footer><p>คลิกพื้นเพื่อเดิน หรือใช้ WASD/ลูกศร · กล้องซูมได้ 2 ระดับและตามตัวละคร · ต้นแบบแยกจากเกมออนไลน์</p><details id="debug"><summary>ข้อมูลการโหลดสำหรับตรวจต้นแบบ</summary><output id="stats"></output><p><a href="index.html">หน้าตรวจภาพ/registration เดิม (โหลดทั้งฉาก)</a></p></details></main><script type="module" src="play.js"></script></html>
