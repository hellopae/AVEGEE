<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AVEGEE · ชายแดนโซน 1</title>
<style>*{box-sizing:border-box}body{margin:0;background:#201b1d;color:#eee0c9;font:15px system-ui}main{max-width:1280px;margin:auto}header,footer{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:12px 16px}h1{font-size:18px;margin:0 auto 0 0}button,select{font:inherit;border:1px solid #8c7353;border-radius:6px;padding:7px 10px;background:#352b28;color:inherit}button[aria-pressed=true]{background:#dcbb82;color:#261c17}canvas{display:block;width:100%;aspect-ratio:16/9;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.frame{position:relative}#status{position:absolute;bottom:10px;left:10px;background:#241a12bf;padding:5px 9px;border-radius:5px;pointer-events:none}#overview{display:none;width:100%}label{display:flex;align-items:center;gap:5px}p{padding:0 16px;color:#bcab98;line-height:1.6}a{color:#e4c38b}@media(max-width:600px){header,footer{padding:8px;gap:7px}h1{width:100%}button,select{font-size:12px;padding:6px}#status{font-size:11px}}</style>
<main><header><h1 id="title">AVEGEE · ชายแดนโซน 1</h1><button id="near" aria-pressed="true">ใกล้</button><button id="closer" aria-pressed="false">ใกล้มาก</button><select id="location" aria-label="บริเวณตรวจภาพ"><option value="center">ลานกลาง</option><option value="left">ฝั่งภูเขาไฟ</option><option value="right">ฝั่งภูเขา</option><option value="south">ประตูล่าง</option></select><button id="play">เล่นแม่น้ำ</button><button id="overviewButton">ภาพรวมย่อ</button></header>
<div class="frame"><canvas id="scene" aria-label="ตรวจภูมิประเทศ ลากเพื่อเลื่อน"></canvas><img id="overview" alt="ภาพรวมภูมิประเทศแบบย่อ"><span id="status">กำลังโหลด…</span></div>
<footer><label><input id="sky" type="checkbox" checked>ท้องฟ้า</label><label><input id="objects" type="checkbox" checked>ประตู / วัตถุ</label><label><input id="mountains" type="checkbox" checked>ภูเขาฉากหลัง</label><label><input id="terrain" type="checkbox" checked>พื้นภูมิประเทศ</label><label><input id="fluid" type="checkbox" checked>แม่น้ำม่วง</label><label><input id="blur" type="checkbox">เบลอภูเขาฉากหลัง</label><label><input id="grid" type="checkbox">ขอบชิ้นไฟล์</label><a href="manifest.json">Manifest</a></footer>
<p>ลากภาพเพื่อตรวจรอยต่อ · ภูเขาอยู่เหนือท้องฟ้า น้ำและลาวาอยู่ใต้พื้น · ประตูและวัตถุแยกจากพื้น มี foot สำหรับประกอบในเกมภายหลัง · <a href="README.md">ไฟล์ภาพ พิกัดและผลตรวจ</a></p>
<script type="module">
import {createStreamCache} from './viewer-cache.js';
const $=id=>document.getElementById(id),canvas=$('scene'),ctx=canvas.getContext('2d'),m=await(await fetch('manifest.json')).json(),layout=await(await fetch(m.layout)).json(),[W,H]=m.world,full=s=>new URL(s,location.href).href;
let center=[W*.53,H*.62],level=0,clock=0,last=0,paused=true,overview=false,ready=false,critical=[],drag=null;
const zooms=[2.25,3.25],controller=new AbortController();
const cache=createStreamCache({maxBytes:40*1048576,concurrency:2,releaseOutside:true,load:async src=>{const r=await fetch(src,{signal:controller.signal});if(!r.ok)throw Error('โหลดภาพไม่สำเร็จ');return createImageBitmap(await r.blob());}});
const get=s=>cache.get(full(s));
const intersects=(a,b)=>a[0]<b[0]+b[2]&&a[0]+a[2]>b[0]&&a[1]<b[1]+b[3]&&a[1]+a[3]>b[1];
function view(){const w=W/zooms[level],h=w*canvas.height/canvas.width;center[0]=Math.max(w/2,Math.min(W-w/2,center[0]));center[1]=Math.max(h/2,Math.min(H-h/2,center[1]));return[center[0]-w/2,center[1]-h/2,w,h];}
function phase(f){const p=clock/f.cycleSeconds*f.frames.length;return {a:Math.floor(p)%f.frames.length,b:(Math.floor(p)+1)%f.frames.length,mix:p%1};}
function requests(){const v=view(),buffer=[v[0]-40,v[1]-40,v[2]+80,v[3]+80],wanted=new Map(),add=s=>wanted.set(s,{id:full(s),src:full(s)});if($('sky').checked)add(m.sky.src);if($('mountains').checked)add(m.mountains.src);
 if($('terrain').checked)for(const t of m.tiles)if(intersects(t.rect,buffer))add(t.src);
 if($('fluid').checked)for(const f of m.liquids)if(intersects(f.rect,buffer)){const p=phase(f);for(const n of [p.a,p.b])add(f.frames[n].src);}
 if($('objects').checked)for(const o of layout.objects)if(intersects([o.x,o.y,o.w,o.h],buffer))add(o.sprite);
 critical=[...wanted.values()].map(r=>r.id);cache.want([...wanted.values()]);
}
function draw(im,r,v,alpha=1,source=null){if(!im)return;const sx=canvas.width/v[2],sy=canvas.height/v[3],x0=Math.round((r[0]-v[0])*sx),y0=Math.round((r[1]-v[1])*sy),x1=Math.round((r[0]+r[2]-v[0])*sx),y1=Math.round((r[1]+r[3]-v[1])*sy);ctx.globalAlpha=alpha;if(source)ctx.drawImage(im,...source,x0,y0,x1-x0,y1-y0);else ctx.drawImage(im,x0,y0,x1-x0,y1-y0);ctx.globalAlpha=1;}
function render(t){requestAnimationFrame(render);const dt=Math.min(.1,Math.max(0,(t-last)/1000));last=t;if(overview)return;requests();ready=cache.ready(critical);if(!paused&&ready&&!document.hidden)clock+=dt;const v=view();ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#846b78';ctx.fillRect(0,0,canvas.width,canvas.height);if($('sky').checked)draw(get(m.sky.src),m.sky.rect,v);
 if($('mountains').checked){ctx.save();if($('blur').checked)ctx.filter='blur(3px)';draw(get(m.mountains.src),m.mountains.rect,v);ctx.restore();}
 if($('fluid').checked)for(const f of m.liquids)if(intersects(f.rect,v)){const p=phase(f);draw(get(f.frames[p.a].src),f.rect,v);if(p.mix)draw(get(f.frames[p.b].src),f.rect,v,p.mix);}
 if($('terrain').checked)for(const t of m.tiles)if(intersects(t.rect,v))draw(get(t.src),t.rect,v,1,t.crop);
 if($('objects').checked){const order={back:0,mid:1,front:2};for(const o of [...layout.objects].sort((a,b)=>order[a.layer]-order[b.layer]||(a.y+a.h*a.foot[1])-(b.y+b.h*b.foot[1])))if(intersects([o.x,o.y,o.w,o.h],v))draw(get(o.sprite),[o.x,o.y,o.w,o.h],v);}
 if($('grid').checked){ctx.strokeStyle='#ffda6b';ctx.lineWidth=1;const sx=canvas.width/v[2],sy=canvas.height/v[3];for(const t of m.tiles)if(intersects(t.rect,v))ctx.strokeRect(Math.round((t.rect[0]-v[0])*sx)+.5,Math.round((t.rect[1]-v[1])*sy)+.5,Math.round(t.rect[2]*sx),Math.round(t.rect[3]*sy));}
 $('status').textContent=cache.stats.errors[0]?.message||(!ready?'กำลังโหลดบริเวณรอบกล้อง…':`ลากเพื่อเลื่อน · ภาพ ${(cache.stats.bytes/1048576).toFixed(1)} MiB`);
}
for(const [id,n]of [['near',0],['closer',1]])$(id).onclick=()=>{level=n;$('near').setAttribute('aria-pressed',String(n===0));$('closer').setAttribute('aria-pressed',String(n===1));};
const places={center:[.53,.62],left:[.18,.60],right:[.84,.60],south:[.53,.90]};$('location').onchange=()=>{center=places[$('location').value].map((n,i)=>n*m.world[i]);};
$('play').onclick=()=>{paused=!paused;$('play').textContent=paused?'เล่นแม่น้ำ':'หยุดภาพ';};$('overviewButton').onclick=()=>{overview=!overview;canvas.style.display=overview?'none':'block';$('overview').style.display=overview?'block':'none';if(overview){$('overview').src=m.preview||'zone1-terrain-preview.jpg';cache.want([]);$('status').style.display='none';}else{$('overview').removeAttribute('src');$('status').style.display='';}$('overviewButton').textContent=overview?'กลับตรวจใกล้':'ภาพรวมย่อ';};
canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,center:[...center],view:view()};};canvas.onpointermove=e=>{if(!drag)return;const b=canvas.getBoundingClientRect();center=[drag.center[0]-(e.clientX-drag.x)/b.width*drag.view[2],drag.center[1]-(e.clientY-drag.y)/b.height*drag.view[3]];};canvas.onpointerup=()=>drag=null;canvas.onpointercancel=()=>drag=null;
function resize(){canvas.width=Math.min(1400,Math.max(280,Math.round(canvas.getBoundingClientRect().width*Math.min(2,devicePixelRatio||1))));canvas.height=Math.round(canvas.width*9/16);}new ResizeObserver(resize).observe(canvas.parentElement);resize();
if(m.label)$('title').textContent=m.label;
window.terrainReview={get ready(){return ready;},get stats(){return cache.stats;},get view(){return view();},get clock(){return clock;},get manifest(){return m;},setFocus:p=>{center=[...p];},setLevel:n=>{level=n;}};
window.addEventListener('pagehide',()=>{controller.abort();cache.destroy();});requestAnimationFrame(render);
</script></main></html>
