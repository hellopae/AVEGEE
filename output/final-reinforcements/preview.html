<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ศึกสุดท้าย · กองหนุนทั้งสี่โซน</title><style>
body{margin:0;background:#110e18;color:#eee;font:17px system-ui;padding:24px}main{max-width:1160px;margin:auto}h1{font-size:27px;color:#ebca7f;margin:0 0 12px}p{line-height:1.6;color:#cfc7de}.flow{padding:14px;background:#292035;border-radius:10px}article{margin:20px 0;background:#21182e;border:1px solid #514066;border-radius:12px;overflow:hidden}img{display:block;width:100%;height:auto}h2{font-size:20px;color:#e8c977;margin:14px 18px 0}article p{margin:8px 18px 18px}.teams{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.teams figure{margin:0;background:#221b2d;border-radius:10px;padding:8px}.teams figcaption{text-align:center;font-size:14px}button{background:#dfb967;color:#24172c;border:0;padding:10px;border-radius:7px;cursor:pointer}#sequence{padding:18px;background:#21182e;border-radius:10px}a{color:#dfc786}@media(max-width:650px){body{padding:12px}.teams{grid-template-columns:repeat(2,1fr)}}
</style><main><h1>กองหนุนจากทั้งสี่สาขา</h1><p class="flow">ปีศาจ 3 wave → กองหนุนปรากฏตัวและรับมือลูกน้อง → พักเติมเลือด / พ่อค้านรก / จัดทีม → หัวหน้าทั้ง 4 → พัก → บอสใหญ่</p><div id="panels"></div><div id="sequence"><b>ตรวจลำดับการต่อสู้</b><p id="status">พร้อมเริ่มศึกทดสอบ · ไม่ใช้เซฟของผู้เล่น</p><button id="step">เริ่มศึกทดสอบ</button></div><h2>ทีมที่ใช้เป็นต้นแบบในฉาก</h2><p>ยมทูตและ Guard ประจำสาขา · นิราใช้ชุดไซเบอร์ในศึกสุดท้าย</p><div class="teams"><figure><img src="squad-th.png" alt="กองหนุนโซน 1"><figcaption>โซน 1</figcaption></figure><figure><img src="squad-asia.png" alt="กองหนุนโซน 2"><figcaption>โซน 2</figcaption></figure><figure><img src="squad-west.png" alt="กองหนุนโซน 3"><figcaption>โซน 3</figcaption></figure><figure><img src="squad-cyberhell.png" alt="กองหนุนโซน 4"><figcaption>โซน 4</figcaption></figure></div></main><script type="module">
import {STORY} from '../../src/story.js';
import {createGame} from '../../src/game.js';
const story=STORY['cyber-reinforcements'];
document.querySelector('#panels').innerHTML=story.pages.map(p=>`<article><img src="../../${p.image}" alt="${p.title}"><h2>${p.title}</h2><p>${p.line}</p></article>`).join('');
const g=createGame();g.save=()=>{};g.zone='cyberhell';g.zoneCases.cyberhell=10;g.zoneEvents.cyberhell={cyberRescue:'cleared',cyberBreach:'cleared'};g.refreshZoneEvents();
let started=false;const status=document.querySelector('#status'),button=document.querySelector('#step');
button.onclick=()=>{if(!started){started=true;g.startZoneEvent('cyberFinal');}else if(g.battle.storyInterlude){g.battle.storyInterlude=null;}else if(g.zoneEventRestReady()){g.advanceZoneEventWave(true);}else if(g.battle.pendingWave){g.advanceZoneEventWave();}else if(!g.battle.over){while(g.battle.foes.some(f=>f.hp>0)){const f=g.battle.foes.find(f=>f.hp>0);f.hp=1;g.battle.selectedFoeId=f.id;g.battleAct('atk');}}
const b=g.battle;status.textContent=b.storyInterlude?'Cutscene: '+STORY[b.storyInterlude].title:g.zoneEventRestReady()?'จุดพัก · เติมเลือด / พ่อค้านรก / จัดทีม · ต่อไป '+(b.pendingWave===4?'หัวหน้าทั้งสี่':'บอสใหญ่'):b.over?'ชนะศึกสุดท้าย':b.pendingWave?'ผ่านระลอก '+b.wave:'ระลอก '+b.wave+' · '+b.foes.map(f=>f.who).join(' / ');
button.textContent=b.storyInterlude?'จบ Cutscene':g.zoneEventRestReady()?'พร้อมแล้ว · ออกจากจุดพัก':b.over?'จบศึก':b.pendingWave?'ไประลอกถัดไป':'ชนะระลอกนี้';button.disabled=!!b.over;};
</script></html>
