<!doctype html><meta charset="utf-8"><title>Bridge paths</title><style>body{margin:0;background:#111}svg{width:100%;display:block}text{font:12px sans-serif;fill:white}</style><svg viewBox="0 0 1672 941"><image href="../../img/zone-world-map.webp" width="1672" height="941"/></svg><script type="module">import {zoneMapRoute} from '../../src/zone-map.js?review=20261002c';const ns='http://www.w3.org/2000/svg',svg=document.querySelector('svg');for(const [i,[a,b]] of [['th','asia'],['th','west'],['asia','cyberhell'],['west','cyberhell']].entries()){const points=zoneMapRoute(a,b);const line=document.createElementNS(ns,'polyline');line.setAttribute('points',points.map(([x,y])=>[x*16.72,y*9.41].join(',')).join(' '));line.setAttribute('fill','none');line.setAttribute('stroke',['lime','yellow','cyan','red'][i]);line.setAttribute('stroke-width','4');svg.append(line);for(const [n,[x,y]] of points.entries()){const text=document.createElementNS(ns,'text');text.setAttribute('x',x*16.72);text.setAttribute('y',y*9.41);text.textContent=n;svg.append(text)}} </script>
