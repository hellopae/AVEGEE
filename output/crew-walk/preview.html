<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../"><title>ท่าเดินยมทูต · 4 โซน</title>
<style>body{background:#160f1b;color:#eadcc9;font:16px system-ui;margin:24px}h1{font-size:24px}button{padding:10px 18px;background:#d7ad61;border:0;border-radius:8px;cursor:pointer}section{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));gap:10px}article{background:#292030;border:1px solid #574258;border-radius:12px;text-align:center}canvas{width:100%;image-rendering:pixelated}h2{color:#ddb16b}p{color:#c8b8c8}@media(max-width:900px){section{grid-template-columns:repeat(4,1fr)}}@media(max-width:500px){section{grid-template-columns:repeat(2,1fr)}}</style>
<h1>ท่าเดินยมทูตและ Guard ครบ 4 โซน</h1><p>นิรา · ฐาน · เพลิง · ดำ · กานต์ · บุญ · Guard — เดินสลับซ้ายและขวา</p><button id="pause">หยุด / เดิน</button> <button id="idle">เทียบกับท่ายืน</button><main></main>
<script type="module">
import {bindZone,drawCrewWalk,drawStandee} from './src/art.js';
const zones={th:'โซน 1 · สุวรรณภูมิ',asia:'โซน 2 · บูรพา',west:'โซน 3 · ปัจฉิม',cyberhell:'โซน 4 · เครือข่าย'};
const keys=['nira','taan','plerng','dam','kan','boon','guard'];let zone='th',paused=false,idle=false,distance=0,last=0;
bindZone(()=>zone);const items=[];
for(const [z,label] of Object.entries(zones)){const h=document.createElement('h2');h.textContent=label;document.querySelector('main').append(h);const section=document.createElement('section');document.querySelector('main').append(section);for(const k of keys){const a=document.createElement('article');a.innerHTML=`<canvas width="200" height="200"></canvas><p>${k}</p>`;section.append(a);const ctx=a.firstChild.getContext('2d');ctx.imageSmoothingEnabled=false;items.push({z,k,ctx});}}
document.querySelector('#pause').onclick=()=>paused=!paused;document.querySelector('#idle').onclick=()=>idle=!idle;
function frame(t){if(!paused)distance+=(t-last)/10;last=t;for(const o of items){zone=o.z;o.ctx.clearRect(0,0,200,200);const face=Math.floor(distance/140)%2? -1:1;if(idle||!drawCrewWalk(o.ctx,'crew-'+o.k,100,180,150,distance,face))drawStandee(o.ctx,'crew-'+o.k,100,180,150,0,'',face,false);}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
