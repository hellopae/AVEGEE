<!doctype html><meta charset="utf-8"><base href="../../"><title>Animation review · 4 zones</title><style>body{background:#171522;color:#fbdba0;font:16px system-ui;margin:24px}button,select{padding:12px;margin:5px}#actors{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.card{background:#272136;border:1px solid #775b32;text-align:center}.actor{height:210px;position:relative;overflow:visible}.actor>img{height:170px;width:150px;object-fit:contain;position:absolute;left:calc(50% - 75px);bottom:8px}h1{font-size:22px}</style><h1>Animation review · Production renderer</h1><label>Zone <select id="zone"><option>th</option><option>asia</option><option>west</option><option>cyberhell</option></select></label><button data-mode="idle">Idle</button><button data-mode="attack">Attack</button><button data-mode="hurt">Hurt</button><main id="actors"></main><script type="module">
import{mountCombatSprites}from './src/combat-sprites.js?v=night-v1';
const refs={"th": {"nira": "img/crew-nira.png", "dam": "img/crew-dam.png", "taan": "img/crew-taan.png", "plerng": "img/crew-plerng.png", "boon": "img/crew-boon.png", "kan": "img/crew-kan.png", "guard": "img/crew-guard-v2.png"}, "asia": {"nira": "img/Asia/crew-nira-asia.png", "dam": "img/Asia/crew-dam-asia.png", "taan": "img/Asia/crew-taan-asia.png", "plerng": "img/Asia/crew-plerng-asia.png", "boon": "img/Asia/crew-boon-asia.png", "kan": "img/Asia/crew-kan-asia.png", "guard": "img/Asia/crew-guard-asia-v2.png"}, "west": {"nira": "img/West/crew-nira-west.png", "dam": "img/West/crew-dam-west.png", "taan": "img/West/crew-taan-west.png", "plerng": "img/West/crew-plerng-west.png", "boon": "img/West/crew-boon-west.png", "kan": "img/West/crew-kan-west.png", "guard": "img/West/crew-guard-west.png"}, "cyberhell": {"nira": "img/CyberHell/crew-nira-cyberhell.png", "dam": "img/CyberHell/crew-dam-cyberhell.png", "taan": "img/CyberHell/crew-taan-cyberhell.png", "plerng": "img/CyberHell/crew-plerng-cyberhell.png", "boon": "img/CyberHell/crew-boon-cyberhell.png", "kan": "img/CyberHell/crew-kan-cyberhell.png", "guard": "img/CyberHell/crew-guard-cyberhell-v2.png"}};let mode='idle';function render(){const z=zone.value;const old=document.querySelector('#actors'),stage=old.cloneNode(false);delete stage.dataset.combatAtlasMounted;old.replaceWith(stage);const entries=[];for(const id of ['dam','taan','plerng','boon','kan','guard','hero-boss','zone-boss','boss-frontier','boss-tester','leader-possessed']){const boss=id.includes('boss')||id==='leader-possessed';const card=document.createElement('section');card.className='card';const root=document.createElement('div');root.className='actor';const img=new Image();img.src=boss?`img/boss-combat-v1/${z}/${id}.webp`:refs[z][id];if(boss){img.src=z==='th'?`img/${id==='leader-possessed'?'leader-th-possessed':id.startsWith('boss-')?id+'-th':id}.png`:id==='leader-possessed'?`img/leader-${z}-possessed.png`:`img/${{asia:'Asia',west:'West',cyberhell:'CyberHell'}[z]}/${id}-${z}.png`;}root.append(img);card.append(root,document.createTextNode(id));stage.append(card);entries.push({root,key:`${boss?'boss':'crew'}:${z}:${id}`,mode,startedAt:Date.now()});}mountCombatSprites(stage,entries);}zone.onchange=render;for(const b of document.querySelectorAll('[data-mode]'))b.onclick=()=>{mode=b.dataset.mode;render();};render();</script>
