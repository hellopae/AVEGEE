<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>พื้นที่เดินชายแดนทั้ง 4 โซน</title><style>body{margin:0;background:#100a15;color:#f5dfb6;font:16px system-ui}nav{padding:16px;display:flex;gap:8px;flex-wrap:wrap}button,a{padding:8px;color:inherit;background:#332136;border:1px solid #9b7542}figure{position:relative;margin:0;width:100%}img{width:100%;display:block}svg{position:absolute;inset:0;width:100%;height:100%}p{padding:0 16px}button[aria-pressed=true]{background:#8a5226}</style><nav id="zones"></nav><p>สีเขียว = เดินได้ · ช่องว่าง = สิ่งกีดขวาง · ใช้พื้นที่เดียวกับระบบเดินจริง <a href="../../index.html">เปิดเกม</a></p><figure><img id="bg"><svg viewBox="0 0 1000 1000" preserveAspectRatio="none"><path id="walk" fill="#20db784a" stroke="#71ffb0" stroke-width="2" fill-rule="evenodd"/></svg></figure><script type="module">
import {FRONTIER_NAV} from '../../src/frontier-navigation.js';
const zones=[['th','โซน 1','../../img/BG-frontier.jpeg'],['asia','โซน 2','../../img/Asia/BG-Frontier-asia.webp'],['west','โซน 3','../../img/West/BG-Frontier-west.webp'],['cyberhell','โซน 4','../../img/CyberHell/BG-Frontier-cyberhell.webp']];
const nav=document.querySelector('#zones');
function show(z){const row=zones.find(r=>r[0]===z),n=FRONTIER_NAV[z];document.querySelector('#bg').src=row[2];document.querySelector('#bg').alt=row[1];document.querySelector('#walk').setAttribute('d',[n.outer,...n.holes].map(poly=>'M'+poly.map(([x,y])=>`${x*1000},${y*1000}`).join(' L')+' Z').join(' '));nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.zone===z)));}
nav.innerHTML=zones.map(([k,name])=>`<button data-zone="${k}">${name}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.zone));show('th');
</script></html>
