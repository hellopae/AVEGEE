<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>อเวจี — นรกโซนสุวรรณภูมิ</title>
<meta name="description" content="เกมบริหารนรกโซนไทย — ยมบาทมือใหม่ที่ต้องพิพากษาให้ตรงกรรม">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Trirong:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ---------- token: ธีมมืด ตั้งชื่อตาม DESIGN.md ---------- */
:root{
  --background:#140a0e;      --foreground:#f2e6dd;
  --card:#1e1015;            --card-foreground:#f2e6dd;
  --muted:#2a171d;           --muted-foreground:#b09a92;
  --secondary:#33202a;       --secondary-foreground:#f2e6dd;
  --accent:#3d2029;          --accent-foreground:#ffd9b0;
  --primary:#c2381f;         --primary-foreground:#fff4ee;
  --gold:#d4a355;            --gold-foreground:#1a0d10;
  --success:#4a9d6a;         --warning:#e0a132;  --destructive:#e04a2f;
  --border:#3a222a;          --input:#54353f;    --ring:#d4a355;

  --radius:0.75rem; --radius-sm:calc(var(--radius)*.5); --radius-md:calc(var(--radius)*.75);
  --space-1:.25rem; --space-2:.5rem; --space-3:.75rem; --space-4:1rem; --space-5:1.5rem;
  --font-sans:"IBM Plex Sans Thai","Noto Sans Thai",-apple-system,sans-serif;
  --font-display:"Trirong",Georgia,serif;
  --text-xs:.8125rem; --text-sm:.9375rem; --text-base:1rem;
  --leading-body:1.7;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(1200px 700px at 50% -10%,#2a1016 0%,var(--background) 60%);
  color:var(--foreground); font-family:var(--font-sans); font-size:var(--text-base);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1480px;margin:0 auto;padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);min-height:100%}

/* ---------- แถบทรัพยากร ---------- */
header{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap}
#ava{object-fit:cover;object-position:center top;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:2px}
h1{font-family:var(--font-display);font-size:1.5rem;margin:0;color:var(--gold);letter-spacing:.5px}
h1 small{display:block;font-family:var(--font-sans);font-size:var(--text-xs);color:var(--muted-foreground);font-weight:400;letter-spacing:0}
.res{display:flex;gap:var(--space-2);flex-wrap:wrap;margin-left:auto}
/* ปุ่มระบบย้ายขึ้นมาบนหัวเรื่อง 8 ก.ย. 2569 — เดิมอยู่ใต้ฉาก ต้องเลื่อนหาทุกครั้ง */
.sysbtn{display:flex;gap:5px;flex-wrap:wrap;width:100%;justify-content:flex-end}
.sysbtn button{padding:5px 10px;min-height:0;font-size:var(--text-xs)}
@media(max-width:820px){.sysbtn{justify-content:flex-start}.sysbtn button{flex:1 1 auto}}
.chip{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:6px 10px;font-size:var(--text-sm);display:flex;gap:6px;align-items:center;white-space:nowrap}
.chip b{font-variant-numeric:tabular-nums}
.bar{width:70px;height:6px;background:var(--muted);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.bar.karma i{background:var(--destructive)}
.bar.hp i{background:var(--success)}

/* ---------- เลย์เอาต์หลัก ----------
   ฉากกินเต็มความกว้าง แผงควบคุมกับบันทึกอยู่ใต้ฉาก
   (เดิมแผงอยู่ข้าง ๆ ทำให้ฉากเหลือความกว้างไม่ถึงสองในสาม) */
.below{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:var(--space-3);align-items:start}
@media(max-width:900px){.below{grid-template-columns:1fr}}
.stage{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:var(--space-2);position:relative;overflow:hidden}

/* ---------- ชั้นซ้อนบนฉาก: บับเบิลคำพูด + เมนูพลัง ----------
   ทุกตำแหน่งคิดเป็น % ของภาพฉาก จึงเลื่อนตามขนาดจอเองโดยไม่ต้องคำนวณใหม่ */
#ov{position:absolute;inset:var(--space-2);pointer-events:none;font-size:var(--text-xs)}
#ov>*{position:absolute}

/* หมุดเหนือหัวตัวละคร — เอาเมาส์ไปชี้ถึงจะกางบับเบิลออกมา
   (บับเบิลกางค้างไว้ตลอดบังฉากจนมองไม่เห็นแผนที่) */
.mark{transform:translate(-50%,-100%);pointer-events:auto;cursor:help}
.mark .pin{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-size:14px;background:rgba(24,11,17,.92);border:1.5px solid var(--gold);
  box-shadow:0 2px 8px rgba(0,0,0,.6);animation:pin 2.2s ease-in-out infinite}
.mark.soul .pin{border-color:#7fb2e0} .mark.boss .pin{border-color:var(--primary)}
@keyframes pin{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.mark .bub{display:none;position:absolute;bottom:34px;left:50%;transform:translateX(-50%)}
.mark.aL .bub{left:-8px;transform:none}
.mark.aR .bub{left:auto;right:-8px;transform:none}
.mark:hover .bub,.mark.show .bub{display:block}
.mark:hover{z-index:9}

.bub{width:min(32vw,340px);background:rgba(24,11,17,.96);
  border:1px solid var(--border);border-radius:var(--radius-md);padding:8px 11px;
  line-height:1.6;box-shadow:var(--shadow-lg)}
.bub:after{content:'';position:absolute;bottom:-8px;left:50%;margin-left:-8px;
  border:8px solid transparent;border-top-color:rgba(24,11,17,.96);border-bottom:0}
.mark.aL .bub:after{left:20px;margin:0} .mark.aR .bub:after{left:auto;right:20px;margin:0}
.bub .who{color:var(--gold);font-weight:600;display:block;margin-bottom:3px}
.bub.soul{background:rgba(18,26,38,.95);border-color:#33455c}
.bub.soul:after{border-top-color:rgba(18,26,38,.95)}
.bub.boss{background:rgba(38,12,10,.96);border-color:var(--primary);width:min(34vw,400px)}
.bub.boss:after{border-top-color:rgba(38,12,10,.96)}
.bub .line{color:var(--muted-foreground);padding:1px 0}
.bub .line.truth{color:var(--gold)} .bub .line.confess{color:var(--warning)}
.bub .line.false{color:var(--destructive)}

/* ---------- แถบบัญชาการเหนือฉาก ----------
   เดิมแผงนี้ลอยทับกลางฉากจนมองแผนที่ไม่เห็น ย้ายมาอยู่เหนือฉากเป็นแถบเต็มความกว้าง */
/* ---------- แถบโค้ช: สอนทีละเรื่อง ----------
   เดิมมีแต่โมดัล "วิธีเล่น" ที่เทสิบสามข้อพร้อมกัน เจ้าของบอกว่าดูยากไป (7 ก.ย. 2569) */
/* ย้ายมาอยู่ล่างสุดของหน้า 8 ก.ย. 2569 — เดิมอยู่ใต้หัวเรื่อง
   ทุกครั้งที่มีบทใหม่ มันดันแถบบัญชาการกับฉากเลื่อนลงไปทั้งแผง จนคลิกผิดที่ */
.coach{background:linear-gradient(90deg,var(--accent),var(--card));
  border:1px solid var(--gold);border-left-width:4px;border-radius:var(--radius);
  padding:var(--space-3) var(--space-4);display:flex;gap:var(--space-3);align-items:flex-start;
  margin-top:auto}
.coach .txt{min-width:0;flex:1}
.coach b{color:var(--gold);font-family:var(--font-display);font-size:1.05rem;display:block;margin-bottom:2px}
.coach p{margin:0;font-size:var(--text-sm);line-height:var(--leading-body)}
.coach .tip{margin-top:6px;font-size:var(--text-xs);color:var(--accent-foreground)}
.coach .step{font-size:var(--text-xs);color:var(--muted-foreground);white-space:nowrap}
.coach button{flex-shrink:0}

/* ชิปทรัพยากรกดได้ทุกอัน — กดแล้วบอกว่าแถบนั้นมีไว้ทำอะไร หมดแล้วเกิดอะไร */
.chip.tap{cursor:pointer;border-color:var(--input)}
.chip.tap:hover{border-color:var(--gold)}
.chip.tap::after{content:'?';font-size:10px;color:var(--muted-foreground);margin-left:2px}

/* ---------- แผงไต่สวน (Phase 2) ----------
   คำให้การเป็นปุ่มกดได้ · จี้ถูกบรรทัดที่ขัดกับสำนวน = ได้ความจริงฟรี */
.quiz .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.quiz .press{font-size:var(--text-xs);color:var(--gold);white-space:nowrap}
.quiz .press b{font-variant-numeric:tabular-nums}
.say{display:block;width:100%;text-align:left;background:var(--muted);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:9px 11px;margin-bottom:7px;font-size:var(--text-sm);
  line-height:var(--leading-body);color:var(--foreground);cursor:pointer;min-height:0}
.say:hover:not(:disabled){border-color:var(--gold);background:var(--accent)}
.say:disabled{cursor:default;opacity:.5}
.say.hit{border-color:var(--success);background:rgba(74,157,106,.14);opacity:1}
.say.miss{border-color:var(--border);opacity:.45;text-decoration:line-through}
.say .q{color:var(--muted-foreground);margin-right:4px}
.back{background:rgba(224,74,47,.12);border:1px solid var(--destructive);border-radius:var(--radius-sm);
  padding:7px 10px;margin-bottom:8px;font-size:var(--text-xs);line-height:1.6;color:var(--foreground)}

/* บรรทัดอธิบายในโมดัล "แถบนี้มีไว้ทำอะไร" — ขั้นที่กำลังอยู่จะไฮไลต์ */
.tline{border-left:3px solid var(--border);padding:6px 0 6px 10px;margin:6px 0;font-size:var(--text-sm)}
.tline b{color:var(--foreground)}
.tline div{color:var(--muted-foreground);font-size:var(--text-xs);line-height:1.6;margin-top:2px}
.tline.on{border-left-color:var(--gold);background:var(--accent);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding-right:8px}
.tline.on b{color:var(--gold)}
.tline.good{border-left-color:var(--success)}
.tline.bad{border-left-color:var(--destructive)}
.tline.bad b{color:var(--destructive)}

.deckbar{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:var(--space-2) var(--space-3);display:flex;gap:var(--space-4);
  flex-wrap:wrap;align-items:flex-end}
.deckbar .grp{display:flex;flex-direction:column;gap:4px;min-width:0}
.deckbar .lb{color:var(--muted-foreground);font-size:11px}
.deckbar .row2{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.deckbar button{padding:5px 9px;min-height:0;font-size:var(--text-xs);line-height:1.35}
.deckbar button[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.deckbar .go{margin-left:auto;align-self:flex-end}
.deckbar .idle{color:var(--muted-foreground);font-size:var(--text-sm);padding:6px 0}
.score{transform:translate(-50%,-100%);font-family:var(--font-display);font-size:2.6rem;
  font-weight:700;text-shadow:0 3px 0 rgba(0,0,0,.75);pointer-events:none}
.score small{display:block;font-family:var(--font-sans);font-size:.75rem;font-weight:400;text-align:center}
canvas{width:100%;height:auto;display:block;image-rendering:pixelated;border-radius:var(--radius-sm);cursor:pointer}
#cv3{aspect-ratio:1527/704;height:auto;touch-action:none}
.ctrl{display:flex;gap:var(--space-2);margin-top:var(--space-2);flex-wrap:wrap;align-items:center}

button{font:inherit;font-size:var(--text-sm);cursor:pointer;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--secondary);color:var(--secondary-foreground);
  padding:8px 12px;min-height:38px;transition:.15s}
button:hover:not(:disabled){border-color:var(--ring);background:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
button.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
button.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-foreground);font-weight:600}
button.sm{padding:5px 9px;min-height:0;font-size:var(--text-xs)}

/* ---------- แผงข้าง ---------- */
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;color:var(--muted-foreground);padding:10px 4px}
.tabs button[aria-selected=true]{color:var(--gold);box-shadow:inset 0 -2px 0 var(--gold);background:var(--muted)}
.tabbody{padding:var(--space-3);height:294px;overflow:auto}
.empty{color:var(--muted-foreground);font-size:var(--text-sm);text-align:center;padding:var(--space-5) 0}

.soul{background:var(--muted);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px;margin-bottom:8px;cursor:pointer;transition:.15s}
.soul:hover{border-color:var(--ring)}
.soul .top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:var(--text-sm)}
.soul .id{color:var(--muted-foreground);font-size:var(--text-xs);font-variant-numeric:tabular-nums}
.deed{font-size:var(--text-xs);color:var(--muted-foreground);margin-top:5px;line-height:1.5}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:99px;margin-right:4px;
  background:var(--accent);color:var(--accent-foreground)}
.wait{color:var(--warning)}

.crew{display:flex;gap:8px;align-items:center;background:var(--muted);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:8px 10px;margin-bottom:8px}
.crew .g{font-size:1.4rem;width:46px;height:46px;flex:none;display:grid;place-items:center}
.crew .g img{width:46px;height:46px;object-fit:cover;object-position:center top;
  border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--muted)}
.crew .n{flex:1;min-width:0}
.crew .n b{font-size:var(--text-sm)}
.crew .st{font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}

/* ---------- แผงข้อมูล (dashboard) ---------- */
.sidebody{padding:var(--space-3);height:294px;overflow:auto}
/* หัวโปรไฟล์ในแผงข้อมูล — ขยายจาก 74px เป็น 132px ตอนเจ้าของเริ่ม gen รูปโปรไฟล์เอง
   .full = รูปโปรไฟล์เต็มใบ (เต็มกรอบ) · ไม่มี .full = รูป standee ตัวยืน (วางชิดล่าง ไม่ครอป) */
.prof{display:flex;gap:14px;align-items:flex-start;margin-bottom:10px}
.prof img{width:132px;height:132px;image-rendering:pixelated;object-fit:contain;object-position:bottom;
  background:var(--muted);border:1px solid var(--border);border-radius:var(--radius-sm);flex:none}
.prof img.full{object-fit:cover;object-position:center top;border-color:var(--gold);image-rendering:auto}
@media(max-width:640px){.prof img{width:96px;height:96px}}
.prof .hd{min-width:0}
.prof .hd b{font-size:1.05rem;font-family:var(--font-display)}
.prof .hd .duty{font-size:var(--text-xs);color:var(--gold);margin-top:2px}
.prof .hd .now{font-size:var(--text-xs);color:var(--muted-foreground);margin-top:4px;line-height:1.5}
.think{background:var(--muted);border-left:2px solid var(--gold);border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  padding:7px 10px;margin:8px 0;font-size:var(--text-sm);color:var(--foreground);line-height:var(--leading-body)}
.kv{display:flex;flex-wrap:wrap;gap:4px 6px;margin:8px 0}
.kv span{font-size:11px;background:var(--muted);border:1px solid var(--border);border-radius:99px;
  padding:2px 8px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.sec{font-size:var(--text-xs);color:var(--muted-foreground);margin:12px 0 5px;
  border-top:1px solid var(--border);padding-top:8px}
.row-truth{font-size:var(--text-xs);line-height:1.6;margin-top:4px}
.row-truth.hid{color:var(--warning)}
.row-truth.fake{color:var(--destructive);text-decoration:line-through}
.picker{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.picker button{padding:3px 9px;min-height:0;font-size:11px}
.picker button[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}
.hintline{font-size:var(--text-xs);color:var(--muted-foreground);margin-top:10px;line-height:1.6}

/* ---------- บันทึก ---------- */
.log{height:294px;overflow:auto;font-size:var(--text-sm);line-height:var(--leading-body);
  padding:var(--space-3)}
.log div{padding:1px 0;color:var(--muted-foreground)}
.log .good{color:var(--success)} .log .bad{color:var(--destructive)}
.log .act{color:var(--foreground)} .log .event{color:var(--gold)}
.log .boss{color:var(--gold);font-family:var(--font-display)}

/* ---------- โมดัล ---------- */
dialog{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);
  color:var(--card-foreground);max-width:520px;width:calc(100% - 32px);padding:var(--space-5);font:inherit}
dialog::backdrop{background:rgba(10,4,6,.78)}
dialog h2{font-family:var(--font-display);color:var(--gold);margin:0 0 var(--space-3);font-size:1.25rem}
.boss{display:flex;gap:var(--space-4);align-items:flex-start}
.boss img{width:150px;height:150px;object-fit:cover;object-position:center top;flex:none;
  border:1px solid var(--gold);border-radius:var(--radius-sm);background:var(--muted)}
.boss img.standee{image-rendering:pixelated;object-fit:contain;object-position:bottom;border-color:var(--border)}
@media(max-width:520px){.boss{flex-direction:column;align-items:center;text-align:center}}
.field{margin-bottom:var(--space-4)}
.field>label{display:block;font-size:var(--text-xs);color:var(--muted-foreground);margin-bottom:6px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.hint{font-size:var(--text-xs);color:var(--muted-foreground);line-height:1.6;margin-top:6px}
.warn{color:var(--warning)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:var(--space-4)}
.shop{display:flex;gap:8px;align-items:center;background:var(--muted);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:9px 10px;margin-bottom:8px}
.shop .n{flex:1;min-width:0}
.shop .n b{font-size:var(--text-sm)} .shop .n div{font-size:11px;color:var(--muted-foreground);line-height:1.45}
footer{color:var(--muted-foreground);font-size:var(--text-xs);text-align:center;padding:var(--space-2) 0}

/* ---------- จอเล็ก ----------
   ปัญหาที่เจอบนมือถือ: แถบบัญชาการยืดเป็นสิบแถวจนดันแผนที่หลุดจอ
   และบับเบิลที่ผูกกับหมุดล้นขอบซ้าย-ขวาจนอ่านไม่ได้ */
@media(max-width:820px){
  .wrap{padding:var(--space-2);gap:var(--space-2)}
  header{gap:var(--space-2)}
  h1{font-size:1.15rem} #ava{width:38px;height:38px}
  .res{width:100%;margin-left:0;gap:5px}
  .chip{font-size:var(--text-xs);padding:4px 7px;flex:1 1 auto}
  .bar{width:44px}

  /* แต่ละกลุ่มเลื่อนแนวนอนในตัวเอง แถบทั้งหมดจึงสูงแค่ 4 แถว ไม่ใช่สิบ */
  .deckbar{gap:var(--space-2);padding:var(--space-2)}
  .deckbar .grp{width:100%}
  .deckbar .row2{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .deckbar .row2::-webkit-scrollbar{display:none}
  .deckbar .row2>button{flex:0 0 auto}
  .deckbar .go{margin-left:0;width:100%;min-height:42px}

  /* บับเบิลกลายเป็นแผ่นติดขอบล่างจอ — ไม่ผูกตำแหน่งกับหมุดอีก จึงไม่มีทางตกขอบ */
  .mark .bub{position:fixed;left:var(--space-2);right:var(--space-2);bottom:var(--space-2);
    top:auto;width:auto;max-height:44vh;overflow:auto;transform:none;z-index:30}
  .mark.aL .bub,.mark.aR .bub{left:var(--space-2);right:var(--space-2);transform:none}
  .bub:after{display:none}
  .mark .pin{width:32px;height:32px;font-size:16px}
  .score{font-size:1.8rem}

  .ctrl{gap:5px} .ctrl button{flex:1 1 auto}
  .tabbody,.sidebody,.log{height:230px}
}

/* ---------- หน้าปก ----------
   ภาพ img/cover.png วางเป็นพื้นหลัง ยังไม่มีไฟล์ก็ยังสวยอยู่ได้ด้วยไล่สีข้างล่าง
   เมนูอยู่ "ครึ่งขวา" ตรงกับที่ ASSET-PROMPTS.md สั่งให้เว้นที่ว่างไว้ */
#title{position:fixed;inset:0;z-index:100;display:grid;grid-template-columns:1fr minmax(300px,38%);
  background:#0b0508;overflow:hidden}
#title.gone{display:none}
#title .art{position:absolute;inset:0;background:
    radial-gradient(900px 600px at 30% 70%,rgba(226,96,32,.28),transparent 65%),
    radial-gradient(700px 500px at 15% 20%,rgba(120,40,90,.30),transparent 70%),
    linear-gradient(160deg,#1a0a12 0%,#0b0508 60%);
  background-size:cover;background-position:center}
#title .art.has{background-image:url('img/cover.png');
  background-size:cover;background-position:center}
#title .scrim{position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(11,5,8,0) 38%,rgba(11,5,8,.72) 62%,rgba(11,5,8,.93) 100%)}
#title .menu{position:relative;grid-column:2;display:flex;flex-direction:column;justify-content:center;
  gap:var(--space-3);padding:var(--space-5) clamp(20px,4vw,44px);min-width:0}
#title .brand{font-family:var(--font-display);font-size:clamp(3rem,7vw,5.5rem);line-height:.95;
  color:var(--gold);margin:0 0 var(--space-2);letter-spacing:2px;text-shadow:0 4px 24px rgba(0,0,0,.8)}
/* ห้ามใช้ชื่อ .tag ตรงนี้ — ชนกับป้ายชนิดบาปในสำนวนที่มีพื้นหลังกับมุมมนอยู่แล้ว
   (เจ้าของเห็นเป็นแถบสีน้ำตาลคาดหลังข้อความบนหน้าปก 8 ก.ย. 2569) */
#title .lead{color:var(--muted-foreground);font-size:var(--text-sm);line-height:1.75;
  margin:0 0 var(--space-4);background:none;padding:0;text-shadow:0 2px 10px rgba(0,0,0,.85)}
#title .lead b{color:var(--accent-foreground);font-weight:500}
#title button{width:100%;justify-content:flex-start;text-align:left;padding:13px 18px;min-height:52px;
  font-size:1.05rem;background:rgba(30,16,21,.82);border-color:var(--border);backdrop-filter:blur(2px)}
#title button:hover:not(:disabled){border-color:var(--gold);background:rgba(61,32,41,.9);transform:translateX(4px)}
#title button b{color:var(--gold);font-weight:600}
#title button small{display:block;color:var(--muted-foreground);font-size:var(--text-xs);
  font-weight:400;margin-top:2px}
#title .foot{color:var(--muted-foreground);font-size:var(--text-xs);margin-top:var(--space-4)}
@media(max-width:820px){
  #title{grid-template-columns:1fr;grid-template-rows:1fr auto}
  #title .menu{grid-column:1;grid-row:2;justify-content:flex-end;padding-bottom:var(--space-5)}
  #title .scrim{background:linear-gradient(180deg,rgba(11,5,8,0) 30%,rgba(11,5,8,.85) 62%,#0b0508 100%)}
  #title .brand{font-size:clamp(2.4rem,13vw,4rem)}
}

/* ---------- หน้าต่างมินิเกม: สอบสวน · ต่อสู้ ----------
   สองอันใช้โครงเดียวกัน — โปรไฟล์สองฝั่ง ตัว SD ยืนอยู่ตรงกลาง แถบข้อมูลข้างล่าง */
dialog.wide{max-width:860px}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:var(--space-3);align-items:end;
  background:linear-gradient(180deg,rgba(46,16,22,.6),rgba(20,10,14,.9));
  border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-3);margin-bottom:var(--space-3)}
.duel .side{min-width:0;display:flex;flex-direction:column;gap:6px}
.duel .side.foe{align-items:flex-end;text-align:right}
.duel .pic{width:100%;max-width:132px;aspect-ratio:1;object-fit:contain;object-position:bottom;
  background:rgba(0,0,0,.28);border:1px solid var(--border);border-radius:var(--radius-sm);
  image-rendering:pixelated}
.duel .nm{font-family:var(--font-display);font-size:1.05rem;color:var(--gold);line-height:1.25}
.duel .sub{font-size:11px;color:var(--muted-foreground)}
.duel .hpbar{width:100%;height:12px;background:var(--muted);border:1px solid var(--border);
  border-radius:99px;overflow:hidden}
.duel .hpbar i{display:block;height:100%;background:var(--success);transition:width .35s}
.duel .hpbar.foe i{background:var(--destructive)}
.duel .hpn{font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.duel .vs{font-family:var(--font-display);font-size:1.6rem;color:var(--primary);padding-bottom:34px}
@media(max-width:560px){.duel .pic{max-width:88px}.duel .vs{font-size:1.1rem;padding-bottom:22px}}

.blog{background:var(--muted);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 12px;font-size:var(--text-sm);line-height:var(--leading-body);
  max-height:150px;overflow:auto;margin-bottom:var(--space-3)}
.blog div{padding:1px 0;color:var(--muted-foreground)}
.blog div:last-child{color:var(--foreground)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts button{flex:1 1 auto;min-width:110px}

/* แผงข้ออ้างในห้องสอบสวน */
.claims{display:flex;flex-direction:column;gap:7px;margin-bottom:var(--space-3)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:var(--space-3)}
.tools button{flex:0 0 auto}
.dossier{background:rgba(0,0,0,.22);border-left:3px solid var(--gold);border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  padding:8px 11px;margin-bottom:var(--space-3);font-size:var(--text-sm);line-height:var(--leading-body)}
.dossier b{color:var(--gold)}
.pure{border-left-color:#7fd8ff}
.pure b{color:#7fd8ff}

/* แถบตั้งค่า */
.setrow{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:var(--text-sm)}
.setrow label{flex:1;min-width:0}
.setrow input[type=range]{width:150px;accent-color:var(--gold)}

/* ---------- เวทีแบบเกม Turn-based RPG ----------
   ใช้ร่วมกันทั้งห้องสอบสวนและฉากต่อสู้ (เจ้าของสั่ง 8 ก.ย. 2569 พร้อมส่งฉากหลังมาให้)
   ฉากหลัง img/BG-Turn-Base.jpeg เป็นลานหินมองจากมุมสูง มีบัลลังก์อยู่กลางบน
   ตัวละครจึงยืน "ริมล่าง" ของลาน ซ้าย-ขวา แล้วเว้นกลางไว้ให้เห็นลวดลายพื้น */
dialog.rpg{max-width:940px;padding:0;overflow:hidden;background:var(--card);
  max-height:92dvh;display:flex;flex-direction:column}
dialog.rpg .arena{flex:0 0 auto}
dialog.rpg .pad{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:var(--space-4);overscroll-behavior:contain}
.arena{position:relative;border-radius:var(--radius) var(--radius) 0 0;overflow:hidden;
  background:#221324 center 38%/cover no-repeat;aspect-ratio:16/6.6;min-height:180px;
  border-bottom:1px solid var(--border)}
.arena:before{content:'';position:absolute;inset:0;
  background:radial-gradient(120% 80% at 50% 120%,rgba(0,0,0,.55),transparent 60%),
             linear-gradient(180deg,rgba(11,5,8,.55),transparent 38%,rgba(11,5,8,.72))}
.arena .x{position:absolute;top:8px;right:8px;z-index:4;width:34px;height:34px;min-height:0;
  padding:0;border-radius:50%;font-size:17px;line-height:1;
  background:rgba(12,6,9,.86);border:1px solid var(--border);backdrop-filter:blur(3px)}
.arena .x:hover:not(:disabled){border-color:var(--gold);background:rgba(61,32,41,.95)}
.arena .ttl{position:absolute;top:10px;left:44px;right:44px;text-align:center;
  font-family:var(--font-display);font-size:1.15rem;color:var(--gold);
  text-shadow:0 2px 6px #000,0 0 14px rgba(0,0,0,.9);z-index:3}
.arena .fig{position:absolute;bottom:6%;z-index:2;display:flex;flex-direction:column;
  align-items:center;gap:5px;width:min(34%,240px)}
.arena .fig.you{left:4%} .arena .fig.foe{right:4%}
.arena .fig img{height:clamp(78px,17vh,148px);width:auto;max-width:100%;object-fit:contain;
  object-position:bottom;image-rendering:pixelated;
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.65))}
/* ⚠️ ทิศทาง — ข้อสรุปหลังเปิดดูสไปรท์จริงทุกใบ (8 ก.ย. 2569)
   ทั้งยมบาทและวิญญาณ **วาดหันหน้าตรงเข้ากล้อง** ไม่ได้หันซ้ายหรือขวา
   พลิกกระจกยังไงก็ไม่ทำให้หันเข้าหากัน มีแต่ทำให้ของที่ไม่สมมาตร (แฟ้ม ขลิบทอง) สลับข้าง
   → ไม่พลิกทั้งคู่ · จะให้หันเข้าหากันจริงต้องมีรูปท่าเฉียงใหม่
     (ดู ASSET-PROMPTS.md ชุดที่ 6 — hero-yama-side) โค้ดรอไฟล์นั้นอยู่แล้ว */
.arena .fig.hit img{animation:hitshake .28s}
@keyframes hitshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

.plate{background:rgba(12,6,9,.86);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:5px 9px;width:100%;text-align:center;backdrop-filter:blur(3px)}
.plate b{display:block;font-size:var(--text-sm);color:var(--gold);line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate .sub{font-size:10px;color:var(--muted-foreground)}
.plate .hpbar{margin-top:4px;height:9px;background:#2a171d;border:1px solid var(--border);
  border-radius:99px;overflow:hidden}
.plate .hpbar i{display:block;height:100%;background:var(--success);transition:width .3s}
.plate .hpbar.foe i{background:var(--destructive)}
.plate .hpn{font-size:10px;color:var(--muted-foreground);font-variant-numeric:tabular-nums;margin-top:1px}
@media(max-width:600px){
  .arena{aspect-ratio:16/8}
  .arena .fig{width:42%} .arena .fig.you{left:1%} .arena .fig.foe{right:1%}
  .arena .ttl{font-size:.95rem}
}

/* เมนูคำสั่งแบบ RPG — แถบปุ่มใหญ่ ๆ กดสลับหน้าที่อยู่ข้างล่าง */
.cmd{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:var(--space-3) 0}
.cmd button{min-height:46px;font-size:var(--text-sm);font-weight:600;
  background:var(--secondary);border:1px solid var(--input)}
.cmd button[aria-pressed=true]{background:var(--primary);border-color:var(--primary);
  color:var(--primary-foreground)}
.cmd button small{display:block;font-weight:400;font-size:10px;opacity:.72}
.panelbox{background:var(--muted);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:var(--space-3);min-height:132px}
.resist{background:rgba(224,74,47,.14);border:1px solid var(--destructive);
  border-radius:var(--radius-sm);padding:7px 10px;margin-bottom:var(--space-3);
  font-size:var(--text-xs);line-height:1.6;color:var(--foreground)}
.verdictgrid{display:grid;gap:var(--space-3)}
.verdictgrid .lb{font-size:11px;color:var(--muted-foreground);margin-bottom:4px;display:block}
.verdictgrid .row2{display:flex;gap:5px;flex-wrap:wrap}
.verdictgrid .row2 button{padding:6px 10px;min-height:0;font-size:var(--text-xs)}
.verdictgrid .row2 button[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}

/* ---------- หน้าสอบสวนแบบ HUD เกม Turn-based RPG (8 ก.ย. 2569 รอบสอง) ----------
   เจ้าของอ้างอิงเลย์เอาต์จากเกม tactics: ฉากเป็นพื้นหลังเต็มจอ · HUD ลอยทับเป็นชั้น ๆ
     บนสุด = แถบสถานะ · ซ้าย = แถวคำสั่งแนวตั้ง · ขวาบน = สำนวน+คำให้การ
     ล่างซ้าย = โปรไฟล์ Yama + ของ · ล่างขวา = โปรไฟล์วิญญาณ */
dialog.hudwrap{max-width:1180px;width:calc(100% - 24px);padding:0;border:0;background:transparent;
  max-height:94dvh;overflow:hidden}
.hud{position:relative;display:flex;flex-direction:column;gap:0;height:min(94dvh,780px);
  background:#221324 center 42%/cover no-repeat;border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;color:var(--foreground)}
.hud-scrim{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(11,5,8,.86) 0%,rgba(11,5,8,.18) 26%,rgba(11,5,8,.20) 52%,rgba(11,5,8,.88) 100%)}
.hud > *{position:relative;z-index:2}
.hud .x{position:absolute;top:8px;right:8px;z-index:6;width:34px;height:34px;min-height:0;padding:0;
  border-radius:50%;font-size:17px;line-height:1;background:rgba(12,6,9,.9);border:1px solid var(--border)}
.hud .x:hover{border-color:var(--gold);background:rgba(61,32,41,.95)}

.hud-top{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:9px 52px 9px 12px}
.hud-top .chip{background:rgba(12,6,9,.82);border:1px solid var(--border);font-size:var(--text-xs);
  padding:4px 9px;backdrop-filter:blur(3px)}
.hud-top .ttl{margin-left:auto;font-family:var(--font-display);color:var(--gold);font-size:var(--text-sm)}

.hud-body{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:168px minmax(0,1fr) minmax(300px,340px);
  gap:10px;padding:0 12px}

/* แถวคำสั่งแนวตั้งฝั่งซ้าย */
.hud-left{display:flex;flex-direction:column;gap:6px;align-content:flex-start;
  min-height:0;overflow-y:auto;padding-bottom:4px}
.hud-left button{display:flex;align-items:center;gap:8px;text-align:left;min-height:44px;padding:6px 10px;
  background:rgba(20,10,15,.86);border:1px solid var(--input);backdrop-filter:blur(3px);font-size:var(--text-sm)}
.hud-left button .ic{font-size:1.15rem;width:22px;text-align:center;flex:none}
.hud-left button .lb2{min-width:0;line-height:1.2}
.hud-left button .lb2 small{display:block;font-size:10px;color:var(--muted-foreground);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:104px}
.hud-left button[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.hud-left button[aria-pressed=true] small{color:rgba(255,255,255,.75)}
.hud-left .fire{background:var(--gold);border-color:var(--gold);color:var(--gold-foreground);font-weight:600}
.hud-left .fire small{color:rgba(26,13,16,.7)}

/* เวทีตรงกลาง — ตัวละครยืนเผชิญหน้ากัน */
.hud-stage{position:relative;min-width:0}
.hud .fig{position:absolute;bottom:6%;display:flex;flex-direction:column;align-items:center;gap:4px}
.hud .fig.you{left:2%} .hud .fig.foe{right:2%}
.hud .fig img{height:clamp(110px,26vh,196px);width:auto;object-fit:contain;object-position:bottom;
  image-rendering:pixelated;filter:drop-shadow(0 8px 12px rgba(0,0,0,.7))}
.hud .fig .nm{font-size:11px;color:var(--gold);background:rgba(12,6,9,.8);border-radius:99px;padding:1px 8px}

/* ขวาบน — สำนวนกับคำให้การ */
.hud-right{display:flex;flex-direction:column;gap:8px;min-height:0}
.hud-card{background:rgba(12,6,9,.86);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:9px 11px;backdrop-filter:blur(3px);min-height:0}
.hud-card h4{margin:0 0 6px;font-size:11px;color:var(--muted-foreground);font-weight:400;
  text-transform:none;letter-spacing:.3px}
.hud-rec{flex:0 0 auto;max-height:34%;overflow-y:auto}
.hud-opt{flex:1 1 auto;overflow-y:auto}
.hud-opt .row2{display:flex;flex-direction:column;gap:5px}
.hud-opt .row2 button{width:100%;text-align:left;padding:7px 10px;min-height:0;font-size:var(--text-xs)}
.hud-opt .row2 button[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.hud-opt .say{margin-bottom:6px;font-size:var(--text-xs);padding:7px 9px}
.hud-log{font-size:11px;line-height:1.65;color:var(--muted-foreground);max-height:96px;overflow-y:auto}
.hud-log .hi{color:var(--gold)}

/* แถวล่าง — โปรไฟล์สองฝั่ง + ของของ Yama */
.hud-bottom{display:flex;gap:10px;align-items:flex-end;padding:10px 12px 12px}
.port{display:flex;gap:9px;align-items:center;background:rgba(12,6,9,.88);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:7px 10px;backdrop-filter:blur(4px);min-width:0}
.port img{width:52px;height:52px;flex:none;object-fit:cover;object-position:center top;
  border:1px solid var(--gold);border-radius:var(--radius-sm);background:var(--muted)}
.port.foe img{border-color:#7fb2e0;object-fit:contain;object-position:bottom;image-rendering:pixelated}
.port .who2{min-width:0}
.port .who2 b{display:block;font-size:var(--text-sm);color:var(--gold);line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.port .who2 small{color:var(--muted-foreground);font-size:10px}
.port.foe{margin-left:auto}
.hud-items{display:flex;gap:5px;margin-left:8px}
.hud-items button{width:44px;height:44px;min-height:0;padding:0;font-size:1.2rem;border-radius:var(--radius-sm);
  position:relative;background:var(--secondary)}
.hud-items button b{position:absolute;right:2px;bottom:0;font-size:9px;color:var(--gold);font-weight:600}
.hud-items button:disabled{opacity:.32}

@media(max-width:900px){
  .hud{height:auto;max-height:94dvh;overflow-y:auto}
  .hud-body{grid-template-columns:1fr;gap:8px}
  .hud-left{flex-direction:row;flex-wrap:wrap}
  .hud-left button{flex:1 1 46%;min-height:40px}
  .hud-left button .lb2 small{display:none}
  .hud-stage{height:180px}
  .hud-right{max-height:none}
  .hud-rec{max-height:none}
  .hud-bottom{flex-wrap:wrap}
  .port.foe{margin-left:0}
}
</style>
</head>
<body>
<div id="title">
  <div class="art" id="cover-art"></div>
  <div class="scrim"></div>
  <div class="menu">
    <h1 class="brand">อเวจี</h1>
    <p class="lead">นรกโซนสุวรรณภูมิ<br>
      <b>ท่านคือยมบาทมือใหม่</b> ลูกของพญายม<br>
      งานของท่านคือ <b>พิพากษาให้ตรงกรรม</b> — ไม่ใช่ลงโทษให้แรงที่สุด</p>
    <button id="t-resume" hidden><b>▶ เล่นต่อ</b><small id="t-resume-info"></small></button>
    <button id="t-new"><b>✦ เริ่มเกมใหม่</b><small>เริ่มจากวาระแรก · สำนวนแรกยืนรออยู่แล้ว</small></button>
    <button id="t-set"><b>⚙ ตั้งค่า</b><small>เสียง · ความเร็ว · ลบข้อมูลที่บันทึกไว้</small></button>
    <div class="foot">ทัณฑ์ที่เกินกรรม มันไม่ได้หายไปไหน — มันมาอยู่ที่ผู้ตัดสิน</div>
  </div>
</div>

<div class="wrap">
  <header>
    <img id="ava" src="img/hero-yama-profile.png" alt="" width="52" height="52"
         onerror="this.onerror=function(){this.remove()};this.src='img/hero-yama.png'">
    <h1>อเวจี<small>นรกโซนสุวรรณภูมิ · ยมบาทฝึกหัด</small></h1>
    <div class="res" id="res"></div>
    <div class="sysbtn">
      <button id="menu" class="sm">↩ ออกไปหน้าเมนู</button>
      <button id="help" class="sm">วิธีเล่น</button>
      <button id="settings" class="sm">⚙ ตั้งค่า</button>
      <button id="mute" class="sm">🔊 เสียง</button>
    </div>
  </header>

  <div class="deckbar" id="deck"></div>

  <div class="stage">
    <canvas id="cv" width="1527" height="704"></canvas>
    <div id="ov"></div>
  </div>
  <div class="ctrl">
    <button id="play" class="pri">▶ เริ่มเดินวาระ</button>
    <button id="spd" class="sm">ความเร็ว ×1</button>
    <button id="atk" class="sm" hidden>⚔️ ฟาดเปรต</button>
    <span id="tickinfo" style="font-size:var(--text-xs);color:var(--muted-foreground)"></span>
    <button id="zone" class="sm" hidden style="margin-left:auto">🗺️ ย้ายโซน</button>
  </div>

  <div class="below">
    <div class="panel">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="queue" aria-selected="true" id="tab-queue">คิววิญญาณ</button>
        <button role="tab" data-tab="crew" aria-selected="false" id="tab-crew">ยมทูต</button>
        <button role="tab" data-tab="build" aria-selected="false" id="tab-build">ก่อสร้าง</button>
      </div>
      <div class="tabbody" id="tabbody"></div>
    </div>
    <div class="panel">
      <div class="tabs" role="tablist">
        <button role="tab" data-side="info" aria-selected="true" id="side-info">ข้อมูล</button>
        <button role="tab" data-side="log" aria-selected="false" id="side-log">บันทึก</button>
      </div>
      <div id="side" class="sidebody"></div>
    </div>
  </div>

  <div class="coach" id="coach" hidden></div>

  <footer>อเวจี — เกมทดลอง · คลิกพื้นหรือกด WASD เพื่อเดิน · บันทึกอัตโนมัติลงเครื่อง</footer>
</div>

<dialog id="dlg"></dialog>
<script type="module" src="src/ui.js"></script>
</body>
</html>
